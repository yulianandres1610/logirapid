    #     status:
    #       type: string
    #       enum:
    #         - ok
    #         - error
    #       description: Operation status
    #     note:
    #       type: string
    #       description: Note sent with this order
    #     created_at:
    #       type: string
    #       format: date-time
    #       description: Creation date
    #     response:
    #       type: string
    #       format: json
    #       description: Processing response for the order
    #     username:
    #       type: string
    #       description: Username who sent the order
    #     name:
    #       type: string
    #       description: User's name who sent the order
    #     last_name:
    #       type: string
    #       description: User's last name who sent the order

  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BasicAuth:
      type: http
      scheme: Basic
      description: Use your API key as the username and your API secret as the password.
