    #   properties:
    #     id:
    #       $ref: "#/components/schemas/UUID"
    #     destination:
    #       type: string
    #       description: Phone number used as target
    #     reference:
    #       type: string
    #       description: Reference number for the order
    #     minutes:
    #       type: integer
    #       format: int32
    #       description: Minutes sent to destination
    #     price:
    #       type: number
    #       format: float
    #       description: Topup price for this order
    #     amount:
    #       type: integer
    #       format: int32
