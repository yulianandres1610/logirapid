components:
  schemas:
    UUID:
      type: string
      format: uuid
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT token
        token_type:
          type: string
          enum:
            - bearer
        expires_in:
          type: number
          description: Time in seconds the token will last
          format: float
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: whether or not the operation was successful
        data:
          type: object
          properties:
            resultCode:
              type: integer
              format: int32
            resultMessage:
              type: string
    ApiErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Flag indicating the operation status.
          default: false
        error:
          type: string
          description: Error message indicating what just happened.
        metadata:
          type: object
          additionalProperties:
            type: object
    CreateUser:
      type: object
      required:
        - parent_id
        - username
        - password
        - email
        - acl_level
      properties:
        parent_id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        password:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
          default: false
        acl_level:
          type: integer
          format: int32
          description: User's access level. Default users (1) and resellers (50)
          enum:
            - 1
            - 50
        callback_url:
          type: string
          nullable: true
        details:
          $ref: "#/components/schemas/CreateUserDetails"
    CreateUserDetails:
      type: object
      required:
        - name
        - last_name
      properties:
        name:
          type: string
        last_name:
          type: string
        birthday:
          type: string
          format: date
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        parent_id:
          $ref: "#/components/schemas/UUID"
        username:
          type: string
        email:
          type: string
          format: email
        api_token:
          type: string
        active:
          type: boolean
        acl_level:
          type: integer
          description: User access level
          format: int32
        prepaid:
          type: boolean
        callback_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        details:
          $ref: "#/components/schemas/UserDetails"
    UserDetails:
      type: object
      properties:
        name:
          type: string
        last_name:
          type: string
        balance:
          type: number
          format: float
        birthday:
          type: string
          format: date
        address:
          type: string
          nullable: true
          deprecated: true
        city:
          type: string
          nullable: true
          deprecated: true
        state_id:
          type: string
          nullable: true
          deprecated: true
        country_id:
          type: string
          nullable: true
          deprecated: true
    UserProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            range:
              type: boolean
              description: Returns if wheter or not the product accepts ranged denominations.
            pivot:
              type: object
              properties:
                user_id:
                  type: string
                  format: uuid
                product_id:
                  type: integer
                  format: int32
                rate:
                  type: number
                  format: float
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
            country:
              $ref: "#/components/schemas/Country"
    ClientsDataTable:
      type: object
      properties:
        draw:
          type: integer
          format: int32
        recordsTotal:
          type: integer
          format: int32
        recordsFiltered:
          type: integer
          format: int32
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
    TopupResponse:
      type: object
      properties:
        success:
          type: boolean
          description: If whether or not the was successful.
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: The order ID used by our system.
            reference:
              type: string
              description: Unique reference used for client when placing the order.
            resultCode:
              type: integer
              description: Internal result code.
            resultMessage:
              type: string
              description: Result message after placing the order.
            destination:
              type: string
              description: The subscriber the topup was for.
            confirmationCode:
              type: string
              description: The confirmation number given by provider if successful.
              nullable: true
            status:
              type: string
              description: Order status
              enum:
                - ok
                - error
                - pending
                - on-hold
    TopupDataTable:
      type: object
      properties:
        draw:
          type: integer
          format: int32
        recordsTotal:
          type: integer
          format: int32
        recordsFiltered:
          type: integer
          format: int32
        data:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: "#/components/schemas/UUID"
              destination:
                type: string
              reference:
                type: string
              price:
                type: number
                format: float
              amount:
                type: integer
                format: int32
              status:
                type: string
                enum:
                  - ok
                  - error
              note:
                type: string
              created_at:
                type: string
                format: date-time
              scheduled_at:
                type: string
                format: date-time
              response:
                type: string
                format: json
              username:
                type: string
    Country:
      type: object
      properties:
        id:
          type: integer
          format: int32
        sortname:
          type: string
        name:
          type: string
        phonecode:
          type: integer
          format: int32
        iso_code_3:
          type: string
        continent_code:
          type: string
        taxable:
          type: integer
          format: int32

    Product:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        slug:
          type: string
        name:
          type: string
        price:
          type: integer
          format: int32
          description: Product's base price
        description:
          type: string
        pattern:
          type: string
          description: Regular expression the input value should match
        country_id:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TopupWebhookPayload:
      type: object
      required:
        - destination
        - resultMessage
        - status
        - reference
        - orderId
      properties:
        destination:
          type: string
          description: The subscriber destination who received the topup.
        resultMessage:
          type: string
          description: Order response message
        confirmationCode:
          type: string
          description: Confirmation code receive by provider.
        status:
          type: string
          description: Order status after completed the execution.
          enum:
            - ok
            - error
        reference:
          type: string
          description: Client's order reference.
        orderId:
          type: string
          description: System's order ID.

    TopupRecord:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        destination:
          type: string
        reference:
          type: string
        price:
          type: number
          format: float
        amount:
          type: number
          format: integer
        status:
          type: string
        responce:
          type: string
        note:
          type: string
        notify:
          type: boolean
        created_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        product:
          $ref: "#/components/schemas/Product"

    Promotion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        product_id:
          type: integer
          format: int32
        min_amount:
          type: integer
          format: int32
          description: Minimum amount applicable to promotion
        from:
          type: string
          format: date-time
        effective_date:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        summary:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        product:
          $ref: "#/components/schemas/Product"

    PromotionsByCountry:
      type: object
      properties:
        id:
          type: integer
          format: int32
        sortname:
          type: string
        name:
          type: string
        phonecode:
          type: integer
          format: int32
        iso_code_3:
          type: string
        continent_code:
          type: string
        taxable:
          type: integer
          format: int32
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"

    # IldResponse:
    #   type: object
    #   properties:
    #     success:
    #       type: boolean
    #       description: Describes successful operation
    #     data:
    #       type: object
    #       properties:
    #         id:
    #           $ref: "#/components/schemas/UUID"
    #         local_reference:
    #           type: string
    # IldTopupDataTable:
    #   type: object
    #   properties:
