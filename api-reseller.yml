openapi: 3.1.0
info:
  title: UnivCell Reseller API
  description: >-
    This is the API description for UnivCell Inc.


    This API uses
    [JWT](https://jwt.io/) for authentication in HTTP header `Authorization` =
    `Bearer xxxx`.


    As another authentication method we have included a [basic auth](https://developer.mozilla.org/en-US/docs/Web/HTTP/Authentication)
    system that you can use when performing operations
    over our API when using the api credentials you can generate under your account.
  termsOfService: "https://univcell.com/terms/"
  contact:
    email: info@univcell.com
  version: "v1"
servers:
  - url: "https://api-staging.univcell.com/"
  - url: "https://api.univcell.com/"
tags:
  - name: auth
    description: API authentication
  - name: user
    description: Operations about user
  - name: topup
    description: Top-up operations and orders
  # - name: ild
  #   description: ILD top-up operations and orders
  - name: products
  # - name: sms

paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: Authenticate a user in the system
      requestBody:
        content:
          application/json:
            schema:
              properties:
                user:
                  type: string
                  description: "Can be username or email"
                password:
                  type: string
      responses:
        200:
          description: successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        400:
          description: >-
            Error during authentication. Please refer to error message and code.
            It can contain an error code like:
              - LOGIN_INPUT_VALIDATION: when given data does not meet minimum requirements.
              - LOGIN_NOT_ACTIVE: when given auth ID is not allowed for authentication.
              - LOGIN_NOT_MISMATCH: credentials mismatch.
              - LOGIN_ERROR: when temporary error occurred while attempting authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                error: "Authentication error."
                metadata:
                  error_code: LOGIN_INPUT_VALIDATION
        404:
          description: If given auth ID was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                error: "User account not found."
                metadata:
                  error_code: LOGIN_NOT_FOUND

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Get a new access token for user.
      description: Get a new token for same user using an existing one. It may be expired.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            description: Expired JWT token that will be used to retrieve a new access token.
            example: Bearer eyJ0...
      responses:
        200:
          description: successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

